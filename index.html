<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ops Toolkit — small tools for people who automate things</title>
<meta name="description" content="Six free tools for automation work: webhook inspector, cron translator, CSV cleaner, contact normalizer, duplicate finder, template checker. Runs entirely in your browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://realaweayomide.github.io/ops-toolkit/">
<meta property="og:title" content="Ops Toolkit — small tools for people who automate things">
<meta property="og:description" content="Six free tools for automation work. No signup, no upload — everything runs in your browser.">
<meta property="og:image" content="https://realaweayomide.github.io/og.png">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0d12;--card:#141824;--soft:#11141b;--line:#232838;--text:#e8ebf2;--muted:#9aa3b5;
    --accent:#6ee7b7;--accent-2:#60a5fa;--warn:#fbbf24;--err:#fca5a5;
    --font:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;--display:'Space Grotesk',var(--font);
    --mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.6;min-height:100vh;
    background-image:radial-gradient(900px 500px at 85% -10%,rgba(110,231,183,.12),transparent 60%),
                     radial-gradient(700px 400px at -5% 100%,rgba(96,165,250,.10),transparent 55%);
    background-attachment:fixed}
  .wrap{max-width:1000px;margin:0 auto;padding:44px 22px 80px}
  h1{font-family:var(--display);font-size:clamp(28px,5vw,40px);margin:0 0 10px;font-weight:700}
  h1 .g{color:var(--accent)}
  .sub{color:var(--muted);font-size:17px;margin:0 0 8px;max-width:680px}
  .note{color:var(--muted);font-size:14px;margin:0 0 28px}
  .note b{color:var(--accent)}

  nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  nav button{font:inherit;font-size:13.5px;font-weight:600;padding:9px 15px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;transition:.15s}
  nav button:hover{color:var(--text);border-color:var(--accent)}
  nav button.on{background:var(--accent);color:#07120d;border-color:transparent}

  .tool h2{font-family:var(--display);font-size:22px;margin:0 0 4px;font-weight:600}
  .tool .tag-line{color:var(--muted);font-size:15px;margin:0 0 18px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
  label{display:block;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);
    margin-bottom:8px;font-weight:600}
  textarea,input[type=text]{width:100%;background:var(--soft);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:13px;font-family:var(--mono);font-size:13px;line-height:1.6;resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.two{grid-template-columns:1fr}}

  .btns{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 18px}
  button.act{font:inherit;font-size:14px;font-weight:600;padding:11px 18px;border-radius:9px;
    border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;transition:.15s}
  button.act:hover{transform:translateY(-1px);border-color:var(--accent)}
  button.act.primary{background:var(--accent);color:#07120d;border-color:transparent}

  .result{display:none}
  .result.show{display:block}
  .stat{display:inline-block;font-family:var(--display);font-size:13px;font-weight:600;color:var(--accent);
    background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 14px;margin-bottom:14px}
  .hint{color:var(--muted);font-size:13.5px;margin:0 0 12px}
  .hint.warn{color:var(--warn)}
  .big{font-family:var(--display);font-size:21px;margin:0 0 16px;line-height:1.4}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  code{font-family:var(--mono);font-size:12.5px;color:var(--accent-2);background:var(--soft);
    padding:2px 6px;border-radius:5px}
  .tag{display:inline-block;font-size:11.5px;font-family:var(--mono);background:var(--soft);
    border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
  .tag.warn{color:var(--warn);border-color:#4a3c1a}
  .tag.good{color:var(--accent);border-color:#1f4538}
  pre.json{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px;
    font-family:var(--mono);font-size:12.5px;line-height:1.6;overflow:auto;max-height:340px;margin:0;white-space:pre-wrap}
  ul.issues{margin:0 0 12px;padding-left:20px;color:var(--muted);font-size:13.5px}
  .err{color:var(--err);font-size:14.5px}
  footer{margin-top:40px;text-align:center;color:var(--muted);font-size:13px}
  footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ops <span class="g">Toolkit</span></h1>
  <p class="sub">Six small tools for the unglamorous parts of automation work — the things you end up doing by hand at 11pm because no one built a tool for them.</p>
  <p class="note">Everything runs <b>in your browser</b>. Nothing is uploaded, nothing is stored, no signup.</p>

  <nav id="nav"></nav>

  <div class="tool">
    <h2 id="tName"></h2>
    <p class="tag-line" id="tTag"></p>

    <div class="panel" id="inputs"></div>

    <div class="btns">
      <button class="act primary" id="run">Run →</button>
      <button class="act" id="sample">Load example</button>
      <button class="act" id="clear">Clear</button>
    </div>

    <div class="panel result" id="result">
      <div id="resultBody"></div>
    </div>
  </div>

  <footer>
    Built by <a href="https://github.com/realaweayomide">Ayomide Awe</a> ·
    <a href="https://github.com/realaweayomide/ops-toolkit">source on GitHub</a> ·
    <a href="https://realaweayomide.github.io">portfolio</a>
  </footer>
</div>

<script src="tools.js"></script>
<script>
const $ = id => document.getElementById(id)
// tools.js declares TOOLS globally above - re-declaring it here would be a syntax error
let current = TOOLS[0]

// build the tab bar
$('nav').innerHTML = TOOLS.map((t,i)=>
  `<button data-i="${i}"${i===0?' class="on"':''}>${t.name}</button>`).join('')

$('nav').onclick = e => {
  const b = e.target.closest('button'); if(!b) return
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on', x===b))
  current = TOOLS[Number(b.dataset.i)]
  mount()
  location.hash = current.id
}

function mount(){
  $('tName').textContent = current.name
  $('tTag').textContent = current.tagline
  const two = current.inputs.length > 1 && current.inputs.every(i => i.rows > 1)
  $('inputs').innerHTML = `<div class="${two ? 'two' : ''}">` + current.inputs.map((inp,i)=>
    `<div><label>${inp.label}</label>` +
    (inp.rows === 1
      ? `<input type="text" id="in${i}" placeholder="${inp.placeholder||''}">`
      : `<textarea id="in${i}" rows="${inp.rows}" spellcheck="false" placeholder="${inp.placeholder||''}"></textarea>`) +
    `</div>`).join('') + `</div>`
  $('result').classList.remove('show')
  // Enter runs single-line tools
  current.inputs.forEach((inp,i)=>{
    if(inp.rows===1) $('in'+i).onkeydown = e => { if(e.key==='Enter') run() }
  })
}

function values(){ return current.inputs.map((_,i)=>$('in'+i).value) }

function run(){
  const vals = values()
  if(!vals[0] || !vals[0].trim()){
    $('result').classList.add('show')
    $('resultBody').innerHTML = '<p class="err">Add some input first — or click <b>Load example</b>.</p>'
    return
  }
  try{
    const r = current.run(vals)
    $('result').classList.add('show')
    $('resultBody').innerHTML = (r.stat ? `<div class="stat">${r.stat}</div>` : '') + r.html
  }catch(err){
    $('result').classList.add('show')
    $('resultBody').innerHTML = '<p class="err">' + String(err.message).replace(/[<>]/g,'') + '</p>'
  }
}

$('run').onclick = run
$('clear').onclick = () => { current.inputs.forEach((_,i)=>$('in'+i).value=''); $('result').classList.remove('show') }
$('sample').onclick = () => {
  current.sample.forEach((v,i)=>{ if($('in'+i)) $('in'+i).value = v })
  run()
}

// deep link support: /ops-toolkit/#cron
const fromHash = TOOLS.findIndex(t => t.id === location.hash.slice(1))
if(fromHash > -1){
  current = TOOLS[fromHash]
  document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('on', i===fromHash))
}
mount()
</script>
</body>
</html>
